<div class="container mx-auto px-3 py-5">
  <h1 style="margin-top: 5rem" class="text-2xl font-bold mb-5">
    Dashboard Admin
  </h1>

  <div class="mb-4">
    <button
      onclick="logout()"
      class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded mr-2"
    >
      LOGOUT
    </button>
    <button
      onclick="toggleForm()"
      class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mr-2"
    >
      CREATE
    </button>
    <button
      onclick="loadData()"
      class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded"
    >
      REFRESH DATA
    </button>
  </div>

  <!-- Form Input -->
  <div id="input-form" class="mb-6 bg-white p-6 rounded-lg shadow-md border">
    <div class="flex justify-between items-center mb-4">
      <h2 id="form-title" class="text-xl font-semibold">Tambah Data Baru</h2>
    </div>

    <input type="hidden" id="edit-id" value="" />

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label for="nama" class="block text-sm font-medium text-gray-700 mb-1"
          >Nama</label
        >
        <input
          type="text"
          id="nama"
          name="nama"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
      </div>

      <div>
        <label for="alamat" class="block text-sm font-medium text-gray-700 mb-1"
          >Alamat</label
        >
        <input
          type="text"
          id="alamat"
          name="alamat"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label
          for="latitude"
          class="block text-sm font-medium text-gray-700 mb-1"
          >Latitude</label
        >
        <input
          type="number"
          id="latitude"
          name="latitude"
          step="any"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Contoh: -7.797068"
        />
      </div>

      <div>
        <label
          for="longitude"
          class="block text-sm font-medium text-gray-700 mb-1"
          >Longitude</label
        >
        <input
          type="number"
          id="longitude"
          name="longitude"
          step="any"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Contoh: 110.370529"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label for="arah" class="block text-sm font-medium text-gray-700 mb-1"
          >Arah</label
        >
        <select
          id="arah"
          name="arah"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        >
          <option value="">Pilih Arah</option>
          <option value="Utara">Utara</option>
          <option value="Timur">Timur</option>
          <option value="Selatan">Selatan</option>
          <option value="Barat">Barat</option>
          <option value="Timur Laut">Timur Laut</option>
          <option value="Tenggara">Tenggara</option>
          <option value="Barat Daya">Barat Daya</option>
          <option value="Barat Laut">Barat Laut</option>
        </select>
      </div>

      <div>
        <label
          for="kondisi"
          class="block text-sm font-medium text-gray-700 mb-1"
          >Kondisi</label
        >
        <select
          id="kondisi"
          name="kondisi"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        >
          <option value="">Pilih Kondisi</option>
          <option value="Baik">Baik</option>
          <option value="Rusak Ringan">Rusak Ringan</option>
          <option value="Rusak Berat">Rusak Berat</option>
          <option value="Perlu Perbaikan">Perlu Perbaikan</option>
        </select>
      </div>
    </div>

    <div>
      <label
        for="keterangan"
        class="block text-sm font-medium text-gray-700 mb-1"
        >Keterangan</label
      >
      <textarea
        id="keterangan"
        name="keterangan"
        rows="3"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Masukkan keterangan tambahan..."
      ></textarea>
    </div>

    <div class="flex justify-end space-x-2 pt-4">
      <button
        type="button"
        onclick="closeForm()"
        class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 transition duration-200"
      >
        Batal
      </button>
      <button
        type="submit"
        class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition duration-200"
        onclick=""
      >
        <span
          id="submit-text"
          onclick="create(document.getElementById('nama').value, document.getElementById('latitude').value, document.getElementById('longitude').value, document.getElementById('alamat').value, document.getElementById('arah').value, document.getElementById('kondisi').value, document.getElementById('keterangan').value)"
          >Simpan</span
        >
      </button>
    </div>
  </div>

  <!-- Tabel Data -->
  <div class="overflow-x-auto bg-white rounded-lg shadow">
    <table class="table-auto border-collapse border border-gray-400 w-full">
      <thead class="bg-gray-100">
        <tr>
          <th class="border border-gray-400 px-4 py-2">No.</th>
          <th class="border border-gray-400 px-4 py-2">Nama</th>
          <th class="border border-gray-400 px-4 py-2">Latitude</th>
          <th class="border border-gray-400 px-4 py-2">Longitude</th>
          <th class="border border-gray-400 px-4 py-2">Alamat</th>
          <th class="border border-gray-400 px-4 py-2">Arah</th>
          <th class="border border-gray-400 px-4 py-2">Kondisi</th>
          <th class="border border-gray-400 px-4 py-2">Keterangan</th>
          <th class="border border-gray-400 px-4 py-2">Action</th>
        </tr>
      </thead>
      <tbody id="data-table-body">
        <tr>
          <td colspan="9" class="border border-gray-400 px-4 py-2 text-center">
            <div id="loading-message">Memuat data...</div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
